[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnse"
version = "1.0.0"
description = "A modular PyTorch framework for developing physics-informed neural network surrogate models for chemical process modeling, simulation, and process systems engineering."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "physics-informed neural networks",
    "modeling and simulation",
    "process systems engineering",
    "chemical engineering",
    "machine learning",
    "deep learning",
    "surrogate modeling",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Harshit Verma", email = "harshit.verma.che@gmail.com" }
]
maintainers = [
    { name = "Harshit Verma", email = "harshit.verma.che@gmail.com" }
]

# Minimum versions: the oldest releases supporting Python 3.11, unless a
# feature needs a newer one (noted).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15",        # qmc samplers take an ``rng`` argument
    "torch>=2.0",         # torch.optim.lr_scheduler.LRScheduler
    "pandas>=2.0",
    "tqdm>=4.65",
    "scikit-learn>=1.2",
    "matplotlib>=3.8",    # Axes.tick_params(labelfontfamily=...)
    "openpyxl>=3.1",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7",
    "furo",
    "myst_parser>=0.13",
    "sphinx_copybutton"
]
aspen = [
    "pywin32"
]
dev = [
    "build",
    "twine",
    "pytest",
    "pytest-cov",
    "prek",
    "mypy",
    "pandas-stubs",
    "scipy-stubs",
    "types-tqdm",
]

[project.urls]
Homepage = "https://github.com/hverma99/pinnse"
Repository = "https://github.com/hverma99/pinnse"
Changelog = "https://github.com/hverma99/pinnse/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinnse*"]

[tool.setuptools.package-data]
# PEP 561 marker: the package ships its own type hints.
pinnse = ["py.typed"]

[tool.mypy]
files = ["pinnse"]
python_version = "3.11"
# Type-check the bodies of functions without annotations too, and flag code
# that the checker proves can never run (often a sign of a wrong annotation).
check_untyped_defs = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
# scikit-learn ships no type hints.
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.ruff.lint]
# Explicit rule set, so results do not change when Ruff changes its defaults.
# E4/E7/E9/F: pyflakes and pycodestyle errors; I: import sorting; B: bugbear.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]  # zip() without strict=

[tool.ruff.lint.per-file-ignores]
# Example scripts define process constants and loop variables for readability.
"examples/**" = ["F841", "B007"]

[tool.ruff.lint.isort]
# Sibling modules imported by the example scripts, and the shared package
# examples/isopfr/common of the isothermal PFR cases.
known-local-folder = ["common", "cstr_model", "data_gen", "main", "pfr_model", "phys_res"]
# On Windows/Anaconda, torch must load before NumPy/SciPy (MKL), or importing
# torch fails with "Error loading ...\torch\lib\shm.dll". Keep it first.
section-order = ["future", "standard-library", "torch", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
torch = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pinnse --cov-report=term-missing --strict-markers --strict-config"
xfail_strict = true
# A warning the test did not expect is an error: tests that exercise a warning
# assert it with pytest.warns, so new or changed warnings cannot go unnoticed.
# The exceptions are warnings raised inside old versions of dependencies, seen
# only with the minimum versions (`nox -s minimums`).
filterwarnings = [
    "error",
    # matplotlib < 3.9 calls pyparsing APIs that pyparsing 3.3 deprecated.
    "ignore:'\\w+' (argument is )?deprecated(, | - )use '\\w+':DeprecationWarning",
    # torch 2.0's own torch.load(weights_only=True) uses TypedStorage (fixed in 2.1).
    "ignore:TypedStorage is deprecated:UserWarning",
]

[tool.coverage.run]
source = ["pinnse"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
