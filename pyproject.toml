[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinnse"
version = "0.2.0"
description = "A modular PyTorch framework for developing physics-informed neural network surrogate models for chemical process modeling, simulation, and process systems engineering."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "physics-informed neural networks",
    "modeling and simulation",
    "process systems engineering",
    "chemical engineering",
    "machine learning",
    "deep learning",
    "surrogate modeling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

]
authors = [
    { name = "Harshit Verma", email = "harshit.verma.che@gmail.com" }
]
maintainers = [
    { name = "Harshit Verma", email = "harshit.verma.che@gmail.com" }
]

dependencies = [
    "numpy",
    "scipy>=1.15",        # qmc samplers take an ``rng`` argument
    "torch>=2.0",         # torch.optim.lr_scheduler.LRScheduler
    "pandas",
    "tqdm",
    "scikit-learn",
    "matplotlib>=3.8",    # Axes.tick_params(labelfontfamily=...)
    "openpyxl"
]

[project.optional-dependencies]
examples = [
    "matplotlib",
    "scikit-learn",
    "openpyxl"
]
docs = [
    "sphinx>=7",
    "furo",
    "myst_parser>=0.13",
    "sphinx_copybutton"
]
aspen = [
    "pywin32"
]
dev = [
    "build",
    "twine",
    "pytest",
    "pytest-cov",
    "prek"
]

[project.urls]
Homepage = "https://github.com/hverma99/pinnse"
Repository = "https://github.com/hverma99/pinnse"

[tool.setuptools.packages.find]
where = ["."]
include = ["pinnse*"]

[tool.ruff.lint]
# Explicit rule set, so results do not change when Ruff changes its defaults.
# E4/E7/E9/F: pyflakes and pycodestyle errors; I: import sorting; B: bugbear.
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B905"]  # zip() without strict=

[tool.ruff.lint.per-file-ignores]
# Example scripts define process constants and loop variables for readability.
"examples/**" = ["F841", "B007"]

[tool.ruff.lint.isort]
# Sibling modules imported by the example scripts.
known-local-folder = ["cstr_model", "data_gen", "pfr_model", "phys_res"]
# On Windows/Anaconda, torch must load before NumPy/SciPy (MKL), or importing
# torch fails with "Error loading ...\torch\lib\shm.dll". Keep it first.
section-order = ["future", "standard-library", "torch", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
torch = ["torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pinnse --cov-report=term-missing"

[tool.coverage.run]
source = ["pinnse"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
